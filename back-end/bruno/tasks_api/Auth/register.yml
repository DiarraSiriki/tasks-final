info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/auth/sign-up/email"
  headers:
    - name: Origin
      value: http://localhost:3000
  body:
    type: json
    data: |-
      {
        "email": "Dago@test.com",
        "password": "Motdepasse123",
        "name": "Junior"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("token", res.getBody().token);
        bru.setEnvVar("userId", res.getBody().user.id);
    - type: tests
      code: |-
        test("statut 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("token présent", function () {
          expect(res.getBody().token).to.be.a("string");
        });

        test("email correspond à la requête", function () {
          const requestBody = req.getBody();
          expect(res.getBody().user.email).to.equal(requestBody.email.toLowerCase());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
